services:
  wireguard:
    networks:
      client_net:

  wg-client:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wg-client
    profiles: ["wg-test"]
    cap_add:
      - NET_ADMIN

    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

    environment:
      - PUID=1000
      - PGID=1000

    volumes:
      - ../test/client_container/wg-client/config:/config 
    networks:
      client_net:

networks:
  client_net: