on:
    workflow_call: 

jobs:
    Wireguard-test:
        runs-on: ubuntu-24.04
        steps:
        -  uses: actions/checkout@v4

        -  name: Network container
           working-directory: container_pihole_vpn
           run: |
            docker compose up -d
            # A fresh volume downloads the blocklist before Pi-hole answers DNS
            timeout 300 bash -c 'until [ "$(docker inspect -f {{.State.Health.Status}} pihole)" = healthy ]; do sleep 5; done'

        -  name: Test PiHole Container
           working-directory: test
           run: |
            g++ -std=c++17 test-pihole.cpp -o test-pihole
            ./test-pihole

        -  name: Test Wireguard Container
           working-directory: test
           run: |
            g++ -std=c++17 test-wireguard.cpp -o test-wireguard
            ./test-wireguard

    #    -  name: Test both containers

        -  name: Tear down the containers   
           if: always()
           working-directory: container_pihole_vpn
           run: |
            docker compose down
            docker compose down --volumes --rmi all --remove-orphans
            docker system prune -a --volumes --force
        
