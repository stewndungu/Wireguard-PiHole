on:
    workflow_call: 

defaults:
    run:
        working-directory: /Wireguard/container_pihole_vpn
jobs:
    Wireguard-test:
        runs-on: ubuntu-24.04
        steps:
        -  name: Network container
           run: docker compose up -d

        -  name: Test PiHole Container
